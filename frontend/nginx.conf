server_tokens off;

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for every response, error pages and proxied API included.
    # nginx drops these in any location that declares an add_header of its own,
    # so such a location (see /index.html) has to repeat all three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # /api/* goes to the backend Service in the same namespace.
    location /api/ {
        proxy_pass         http://homelab-backend:8000;
        # $http_host keeps the port ($host would drop :30300). The backend
        # compares it with the browser's Origin and rejects a mismatch.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing build asset is a 404, never the HTML page.
    location /assets/ {
        try_files $uri =404;
    }

    # Never cache the entry page, so a new build is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
